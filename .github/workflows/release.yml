name: Tagged container release
on:
  workflow_dispatch:
  push:
    tags: ['v-*.*.*']
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: codeitz
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: codeitz
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U codeitz" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: codeitz
      PGUSER: codeitz
      PGPASSWORD: disposable-ci-only
      PGSSLMODE: disable
      CODEITZ_TEST_POSTGRES: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.1'
      - name: Validate release and assemble pinned source
        id: source
        env:
          RELEASE_FRAMEWORK_KEY: ${{ secrets.RELEASE_FRAMEWORK_KEY }}
          RELEASE_UI_KEY: ${{ secrets.RELEASE_UI_KEY }}
          RELEASE_SDK_KEY: ${{ secrets.RELEASE_SDK_KEY }}
          RELEASE_GOVERNANCE_KEY: ${{ secrets.RELEASE_GOVERNANCE_KEY }}
        run: |
          node .container/release.mjs check
          node .container/release.mjs context
      - name: Verify and build candidate
        env:
          CONTEXT: ${{ steps.source.outputs.context }}
        run: |
          OWNER=$(node -p "require('./.container/release.json').owner")
          BASE=$(node -p "require('./.container/release.json').baseImage")
          VERSION=$(node -p "require('./package.json').version")
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          (cd "$CONTEXT/foundation/framework" && npm ci --ignore-scripts --no-audit && npm run build)
          (cd "$CONTEXT/packages/ui" && npm ci --ignore-scripts --no-audit && npm run build)
          (cd "$CONTEXT/$OWNER" && npm ci --ignore-scripts --no-audit && npm run typecheck && npm run build && npm test && npm run check:versions)
          if [ "$OWNER" = apps/platform ]; then (cd "$CONTEXT/$OWNER" && npm run test:postgres); fi
          if [ "$OWNER" = apps/core-app ]; then
            (cd "$CONTEXT/$OWNER" && node --input-type=module -e "import pg from 'pg'; const db=new pg.Client(); await db.connect(); try { await db.query('CREATE DATABASE core_app_test'); } finally { await db.end(); }")
            printf 'NODE_ENV=test\nCORE_APP_DATABASE_URL=postgresql://codeitz:disposable-ci-only@127.0.0.1:5432/core_app_test\n' > "$CONTEXT/$OWNER/.env.test"
            (cd "$CONTEXT/$OWNER" && npm run test:database)
          fi
          docker build --build-arg "NODE_IMAGE=$BASE" --build-arg "APP_VERSION=$VERSION" --build-arg "SOURCE_DIGEST=$GITHUB_SHA" --label "org.opencontainers.image.version=$VERSION" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -f "$CONTEXT/$OWNER/.container/Dockerfile" -t "$IMAGE:$GITHUB_REF_NAME" "$CONTEXT"
      - name: Publish immutable release image and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo 'Release already published; use a new version.'; exit 1; fi
          docker push "$IMAGE:$GITHUB_REF_NAME"
          DIGEST=$(docker image inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{index .RepoDigests 0}}')
          export RELEASE_IMAGE="$IMAGE" RELEASE_DIGEST="${DIGEST##*@}"
          docker save "$IMAGE:$GITHUB_REF_NAME" | gzip > image.tar.gz
          export RELEASE_ARCHIVE_SHA256="$(sha256sum image.tar.gz | cut -d ' ' -f 1)"
          export RELEASE_IMAGE_ID="$(docker image inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{.Id}}')"
          node .container/release.mjs manifest
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file docs/release-notes.md release-manifest.json image.tar.gz
